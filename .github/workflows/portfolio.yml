name: Portfolio B3 - Reproducao do Estudo

on:
  workflow_dispatch:

jobs:
  reproduce-study:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Run historical portfolio study
        run: python run.py

      - name: Update current B3 prices
        run: python update_prices.py

      - name: Update current B3 fundamentals
        run: python update_fundamentals.py

      - name: Upload historical reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-b3-historical-report
          path: reports/
          if-no-files-found: warn

      - name: Upload current operational data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-b3-current-data
          path: data_live/
          if-no-files-found: warn
